id: core.integer.div
schema_version: 1
version: 1.0.0
summary: "Truncating integer division."
signature:
  source: intrinsic
  type_parameters:
    - {name: T, family: type.integer}
  inputs:
    - {name: a, type: "T"}
    - {name: b, type: "T"}
  outputs:
    - {name: result, type: "T"}
depends_on:
  - {id: type.integer, version: 1.0.0}
suspension: never
determinism: deterministic
behavior:
  zero: "Not applicable."
  nil: "Not applicable."
  bounds: "Not applicable."
  conversions: "Not applicable."
  overflow: "For signed types, the most negative value divided by -1 wraps to the most negative value."
  mutations: "Not applicable."
  aliasing: "Not applicable."
  allocation: "Not applicable."
  errors: "Not applicable."
  panics: "A zero divisor panics with runtime error: integer divide by zero."
  observations: "The truncated quotient."
panic_categories: [divide_by_zero]
cases:
  - name: trunc_neg
    types: {"T": "int"}
    let:
      - {name: a, type: "T", value: "-7"}
      - {name: b, type: "T", value: "2"}
    call: ["a", "b"]
    expect:
      results: ["-3"]
  - name: trunc_pos
    types: {"T": "int"}
    let:
      - {name: a, type: "T", value: "7"}
      - {name: b, type: "T", value: "-2"}
    call: ["a", "b"]
    expect:
      results: ["-3"]
  - name: int64_min_neg1
    types: {"T": "int64"}
    let:
      - {name: a, type: "T", value: "-9223372036854775808"}
      - {name: b, type: "T", value: "-1"}
    call: ["a", "b"]
    expect:
      results: ["-9223372036854775808"]
  - name: int8_min_neg1
    types: {"T": "int8"}
    let:
      - {name: a, type: "T", value: "-128"}
      - {name: b, type: "T", value: "-1"}
    call: ["a", "b"]
    expect:
      results: ["-128"]
  - name: uint64_big
    types: {"T": "uint64"}
    let:
      - {name: a, type: "T", value: "18446744073709551615"}
      - {name: b, type: "T", value: "3"}
    call: ["a", "b"]
    expect:
      results: ["6148914691236517205"]
  - name: by_zero
    types: {"T": "int32"}
    let:
      - {name: a, type: "T", value: "1"}
      - {name: b, type: "T", value: "0"}
    call: ["a", "b"]
    expect:
      panic: {category: divide_by_zero, message: "runtime error: integer divide by zero"}

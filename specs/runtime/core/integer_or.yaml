id: core.integer.or
schema_version: 1
version: 1.0.0
summary: "Bitwise OR."
signature:
  source: intrinsic
  type_parameters:
    - {name: T, family: type.integer}
  inputs:
    - {name: a, type: "T"}
    - {name: b, type: "T"}
  outputs:
    - {name: result, type: "T"}
depends_on:
  - {id: type.integer, version: 1.0.0}
suspension: never
determinism: deterministic
behavior:
  zero: "Not applicable."
  nil: "Not applicable."
  bounds: "Not applicable."
  conversions: "Not applicable."
  overflow: "Bitwise results are always representable in T."
  mutations: "Not applicable."
  aliasing: "Not applicable."
  allocation: "Not applicable."
  errors: "Not applicable."
  panics: "Not applicable."
  observations: "The typed result."
cases:
  - name: u32
    types: {"T": "uint32"}
    let:
      - {name: a, type: "T", value: "2147483648"}
      - {name: b, type: "T", value: "1"}
    call: ["a", "b"]
    expect:
      results: ["2147483649"]
  - name: i8
    types: {"T": "int8"}
    let:
      - {name: a, type: "T", value: "-128"}
      - {name: b, type: "T", value: "1"}
    call: ["a", "b"]
    expect:
      results: ["-127"]

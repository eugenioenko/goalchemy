id: core.integer.mul
schema_version: 1
version: 1.0.0
summary: "Wrapping multiplication."
signature:
  source: intrinsic
  type_parameters:
    - {name: T, family: type.integer}
  inputs:
    - {name: a, type: "T"}
    - {name: b, type: "T"}
  outputs:
    - {name: result, type: "T"}
depends_on:
  - {id: type.integer, version: 1.0.0}
suspension: never
determinism: deterministic
behavior:
  zero: "Not applicable."
  nil: "Not applicable."
  bounds: "Not applicable."
  conversions: "Operands share the type T; no implicit conversion occurs."
  overflow: "The result wraps modulo 2^width and is reinterpreted with the type's signedness."
  mutations: "Not applicable."
  aliasing: "Not applicable."
  allocation: "Not applicable."
  errors: "Not applicable."
  panics: "Not applicable."
  observations: "The typed result."
cases:
  - name: int32_wrap
    types: {"T": "int32"}
    let:
      - {name: a, type: "T", value: "65536"}
      - {name: b, type: "T", value: "65536"}
    call: ["a", "b"]
    expect:
      results: ["0"]
  - name: uint32_exact
    types: {"T": "uint32"}
    let:
      - {name: a, type: "T", value: "4294967295"}
      - {name: b, type: "T", value: "4294967295"}
    call: ["a", "b"]
    expect:
      results: ["1"]
  - name: int64_wrap
    types: {"T": "int64"}
    let:
      - {name: a, type: "T", value: "9223372036854775807"}
      - {name: b, type: "T", value: "2"}
    call: ["a", "b"]
    expect:
      results: ["-2"]
  - name: uint64_big
    types: {"T": "uint64"}
    let:
      - {name: a, type: "T", value: "18446744073709551615"}
      - {name: b, type: "T", value: "18446744073709551615"}
    call: ["a", "b"]
    expect:
      results: ["1"]
  - name: int32_neg
    types: {"T": "int32"}
    let:
      - {name: a, type: "T", value: "-123456789"}
      - {name: b, type: "T", value: "987654321"}
    call: ["a", "b"]
    expect:
      results: ["-67153019"]
  - name: int8_wrap
    types: {"T": "int8"}
    let:
      - {name: a, type: "T", value: "16"}
      - {name: b, type: "T", value: "16"}
    call: ["a", "b"]
    expect:
      results: ["0"]

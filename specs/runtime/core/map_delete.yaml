id: core.map.delete
schema_version: 1
version: 1.0.0
summary: "delete(m, k)."
signature:
  source: intrinsic
  type_parameters:
    - {name: K, family: any, comparable: true}
    - {name: V, family: any}
  inputs:
    - {name: m, type: "map[K]V"}
    - {name: k, type: "K"}
  outputs: []
depends_on:
  - {id: type.map, version: 1.0.0}
suspension: never
determinism: deterministic
behavior:
  zero: "Not applicable."
  nil: "Deleting from a nil map does nothing."
  bounds: "Not applicable."
  conversions: "Not applicable."
  overflow: "Not applicable."
  mutations: "Removes the entry; reinsertion later appends a new entry."
  aliasing: "All copies of a map value share entries."
  allocation: "Not applicable."
  errors: "Not applicable."
  panics: "Not applicable."
  observations: "Not applicable."
cases:
  - name: reinsert_moves
    types: {"K": "int", "V": "int"}
    let:
      - {name: m, type: "map[K]V", value: {"map": [{"key": "1", "value": "1"}, {"key": "2", "value": "2"}]}}
      - {name: k, type: "K", value: "1"}
    call: ["m", "k"]
    expect:
      results: []
      after:
        - {name: m, value: {"map": [{"key": "2", "value": "2"}]}}
  - name: nil_map
    types: {"K": "int", "V": "int"}
    let:
      - {name: m, type: "map[K]V", value: {"nil": true}}
      - {name: k, type: "K", value: "1"}
    call: ["m", "k"]
    expect:
      results: []

id: core.integer.compare
schema_version: 1
version: 1.0.0
summary: "Three-way comparison returning -1, 0, or 1."
signature:
  source: intrinsic
  type_parameters:
    - {name: T, family: type.integer}
  inputs:
    - {name: a, type: "T"}
    - {name: b, type: "T"}
  outputs:
    - {name: result, type: "int"}
depends_on:
  - {id: type.integer, version: 1.0.0}
suspension: never
determinism: deterministic
behavior:
  zero: "Not applicable."
  nil: "Not applicable."
  bounds: "Not applicable."
  conversions: "Unsigned values compare as unsigned regardless of host representation."
  overflow: "Not applicable."
  mutations: "Not applicable."
  aliasing: "Not applicable."
  allocation: "Not applicable."
  errors: "Not applicable."
  panics: "Not applicable."
  observations: "Not applicable."
cases:
  - name: unsigned_high
    types: {"T": "uint64"}
    let:
      - {name: a, type: "T", value: "18446744073709551615"}
      - {name: b, type: "T", value: "1"}
    call: ["a", "b"]
    expect:
      results: ["1"]
  - name: signed
    types: {"T": "int64"}
    let:
      - {name: a, type: "T", value: "-1"}
      - {name: b, type: "T", value: "1"}
    call: ["a", "b"]
    expect:
      results: ["-1"]
  - name: equal
    types: {"T": "uint32"}
    let:
      - {name: a, type: "T", value: "7"}
      - {name: b, type: "T", value: "7"}
    call: ["a", "b"]
    expect:
      results: ["0"]
  - name: u32_high
    types: {"T": "uint32"}
    let:
      - {name: a, type: "T", value: "4294967295"}
      - {name: b, type: "T", value: "0"}
    call: ["a", "b"]
    expect:
      results: ["1"]

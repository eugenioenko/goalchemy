id: core.integer.add
schema_version: 1
version: 1.0.0
summary: "Wrapping addition of two integers of the same type."
signature:
  source: intrinsic
  type_parameters:
    - {name: T, family: type.integer}
  inputs:
    - {name: a, type: "T"}
    - {name: b, type: "T"}
  outputs:
    - {name: result, type: "T"}
depends_on:
  - {id: type.integer, version: 1.0.0}
suspension: never
determinism: deterministic
behavior:
  zero: "Not applicable."
  nil: "Not applicable."
  bounds: "Not applicable."
  conversions: "Operands share the type T; no implicit conversion occurs."
  overflow: "The result wraps modulo 2^width and is reinterpreted with the type's signedness."
  mutations: "Not applicable."
  aliasing: "Not applicable."
  allocation: "Not applicable."
  errors: "Not applicable."
  panics: "Not applicable."
  observations: "The typed result."
cases:
  - name: int8_wrap
    types: {"T": "int8"}
    let:
      - {name: a, type: "T", value: "127"}
      - {name: b, type: "T", value: "1"}
    call: ["a", "b"]
    expect:
      results: ["-128"]
  - name: uint64_wrap
    types: {"T": "uint64"}
    let:
      - {name: a, type: "T", value: "18446744073709551615"}
      - {name: b, type: "T", value: "1"}
    call: ["a", "b"]
    expect:
      results: ["0"]
  - name: int64_min
    types: {"T": "int64"}
    let:
      - {name: a, type: "T", value: "-9223372036854775808"}
      - {name: b, type: "T", value: "-1"}
    call: ["a", "b"]
    expect:
      results: ["9223372036854775807"]
  - name: int32_plain
    types: {"T": "int32"}
    let:
      - {name: a, type: "T", value: "40"}
      - {name: b, type: "T", value: "2"}
    call: ["a", "b"]
    expect:
      results: ["42"]
  - name: uint32_wrap
    types: {"T": "uint32"}
    let:
      - {name: a, type: "T", value: "4294967295"}
      - {name: b, type: "T", value: "2"}
    call: ["a", "b"]
    expect:
      results: ["1"]
  - name: int_big
    types: {"T": "int"}
    let:
      - {name: a, type: "T", value: "4611686018427387904"}
      - {name: b, type: "T", value: "4611686018427387904"}
    call: ["a", "b"]
    expect:
      results: ["-9223372036854775808"]

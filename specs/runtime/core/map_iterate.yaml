id: core.map.iterate
schema_version: 1
version: 1.0.0
summary: "Snapshot iteration: the keys in visiting order when nothing changes during iteration."
signature:
  source: intrinsic
  type_parameters:
    - {name: K, family: any, comparable: true}
    - {name: V, family: any}
  inputs:
    - {name: m, type: "map[K]V"}
  outputs:
    - {name: keys, type: "[]K"}
depends_on:
  - {id: type.map, version: 1.0.0}
  - {id: type.slice, version: 1.0.0}
suspension: never
determinism: deterministic
behavior:
  zero: "Not applicable."
  nil: "A nil map yields no entries."
  bounds: "Not applicable."
  conversions: "Not applicable."
  overflow: "Not applicable."
  mutations: "Not applicable."
  aliasing: "All copies of a map value share entries."
  allocation: "Not applicable."
  errors: "Not applicable."
  panics: "Not applicable."
  observations: "Insertion order. Entries deleted before being visited are skipped; entries inserted during iteration are not visited; values are read at visit time."
cases:
  - name: insertion_order
    types: {"K": "int", "V": "int"}
    let:
      - {name: m, type: "map[K]V", value: {"map": [{"key": "3", "value": "0"}, {"key": "1", "value": "0"}, {"key": "2", "value": "0"}]}}
    call: ["m"]
    expect:
      results: [{"slice": ["3", "1", "2"], "cap": "3"}]

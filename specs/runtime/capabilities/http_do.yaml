  "behavior": {
    "zero": "Zero key handles are invalid. Empty byte inputs are permitted unless an operation requires a fixed size.",
    "nil": "Nil byte slices are empty. Nil keys/HTTP contexts return an error; Close accepts nil.",
    "bounds": "GET/POST only; GET has empty body. URL<=8192 bytes, request/reply body<=64MiB, header bytes<=64KiB, timeoutMillis=1..300000. Header input alternates name/value; odd length, invalid tokens, control bytes and framing/hop/proxy headers are rejected.",
    "conversions": "Not applicable.",
    "overflow": "Not applicable.",
    "mutations": "Input bytes and header slices are not mutated. Close invalidates aliases of its key.",
    "aliasing": "Outputs are independently owned. Keys are aliased opaque handles; Close prevents new acquisitions. In-flight operations may retain key snapshots through completion.",
    "allocation": "Native buffers are host-managed. No guaranteed private-material erasure. Future async adapters retain inputs/keys until completion and do not borrow mutable host buffers.",
    "errors": "Transport, context cancellation/deadline and limit failures return zero status/nil headers/nil body and error. Non-2xx and redirects return ordinary responses.",
    "panics": "No deliberate panic on invalid input. Host allocation failures remain host failures.",
    "observations": "Real timeoutMillis and earlier parent deadline bound request. Native std context cancellation is propagated. No redirects, normal trusted TLS verification, host-configured proxy. Automatic gzip decoding follows stdlib transport; body limit applies to decoded bytes; automatically decoded Content-Encoding/Length headers are removed. Response header names sorted/canonicalized; duplicate values retain server order; wire inter-name order is not retained."
  },

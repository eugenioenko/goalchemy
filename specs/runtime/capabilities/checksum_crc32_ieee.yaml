  "schema_version": 1,
  "version": "1.0.0",
  "summary": "checksum.CRC32IEEE: IEEE CRC-32 checksum over a byte slice, as used by ZIP.",
  "signature": {
    "source": "declaration",
    "symbol": "github.com/eugenioenko/goalchemy/lib/checksum.CRC32IEEE",
    "type_parameters": [],
    "inputs": [
      {
        "name": "data",
        "type": "[]byte"
      }
    ],
    "outputs": [
      {
        "name": "checksum",
        "type": "uint32"
      }
    ]
  },
  "depends_on": [],
  "suspension": "never",
  "determinism": "deterministic",
  "behavior": {
    "zero": "Empty inputs return zero.",
    "nil": "A nil slice is an empty input and returns zero.",
    "bounds": "All bytes in the logical slice are consumed; bytes outside its length are ignored. No capability-specific size limit.",
    "conversions": "The result is an unsigned 32-bit Go value, including values above 2^31-1.",
    "overflow": "IEEE reflected polynomial 0xedb88320, initial state 0xffffffff and final bitwise complement; arithmetic is modulo 2^32.",
    "mutations": "The input and its backing storage are not modified.",
    "aliasing": "No reference to input storage escapes the call.",
    "allocation": "Hosts may allocate internal checksum state or lookup tables; the caller retains input ownership.",
    "errors": "No error result.",
    "panics": "No deliberate panic for valid slices; host failures remain host failures.",
    "observations": "Matches Go hash/crc32.ChecksumIEEE. This is a checksum, not a cryptographic integrity primitive."
  },
  "notes": "Standard-library IEEE CRC APIs in Go (hash/crc32), Java (java.util.zip.CRC32), Python (zlib.crc32), and TypeScript Node executable/conformance/Node library entries (node:zlib.crc32). C# uses the official Microsoft System.IO.Hashing 8.0.0 NuGet package, separate from the shared .NET runtime. Rust uses the pinned crc32fast 1.5.2 crate with its default std feature enabled for runtime CPU detection. Browsers, portable TypeScript main entries, and C retain slicing-by-8 fallbacks because their standard environments provide no CRC API. Host APIs control acceleration; no hardware execution is guaranteed.",

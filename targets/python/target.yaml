schema_version: 1
target: python
version: 0.1.0
status: experimental
environment:
  runtime: CPython
  minimum: "Python 3.10 (the release baseline for now; it can be raised later)"
  build: python3 main.py
representations:
  - {type: type.boolean, contract_version: 1.0.0, representation: Python bool.}
  - {type: type.integer, contract_version: 1.0.0, representation: "Python int normalized to the Go width and signedness after every operation (types/integer.py)."}
  - {type: type.string, contract_version: 1.0.0, representation: "Python bytes: immutable, byte-indexed, compared bytewise."}
  - {type: type.array, contract_version: 1.0.0, representation: "Python lists with generated zero, clone, in-place set, equality, and key helpers per array type."}
  - {type: type.struct, contract_version: 1.0.0, representation: "One generated class with __slots__ per struct type; storage objects are updated in place by _set, so field pointers stay valid."}
  - {type: type.slice, contract_version: 1.0.0, representation: "Immutable Slice headers (a, o, l, c) over shared lists (types/slice.py); rt.NIL is the nil slice."}
  - {type: type.map, contract_version: 1.0.0, representation: "GoMap: a dict from encoded keys to entries plus an insertion-ordered entry list (types/map.py); nil is None."}
  - {type: type.pointer, contract_version: 1.0.0, representation: "Pointers to structs and arrays are the objects themselves; other pointers are Cell or canonical FieldRef objects with a v attribute (types/ref.py); nil is None."}
  - {type: type.interface, contract_version: 1.0.0, representation: "None or a Box (t, v) with per-type equality, key encoding, and method tables (types/iface.py)."}
  - {type: type.function, contract_version: 1.0.0, representation: "Python callables tagged with _fid for recover identity; closures capture cells; nil is None."}
  - {type: type.error, contract_version: 1.0.0, representation: "Interface Boxes; runtime errors use the RUNTIME_ERROR, PLAIN_ERROR, and TYPE_ASSERTION_ERROR descriptors (types/panic.py)."}
  - {type: type.channel, contract_version: 1.0.0, representation: "Chan objects with a buffer and FIFO wait queues (runtime/chan_make.py); None is the nil channel."}
  - {type: type.task, contract_version: 1.0.0, representation: "A stack of resumable frames per task driven by a trampoline (runtime/task_spawn.py): suspending functions compile to frame classes with a step method; exactly one task runs at a time, dispatched FIFO."}
harness:
  support: [tests/harness/harness.py, tests/harness/codec.py, rt_index.py]
  generated: tests/harness/harness_gen.py
  command: [python3, targets/python/tests/harness/harness.py]
support_files: [types/integer.py, types/panic.py, types/iface.py, types/ref.py, types/slice.py, types/map.py, types/print.py, types/bounds.py, types/utf8.py, types/program.py]
functions:
  - {id: core.integer.add, contract_version: 1.0.0, symbol: "rt.add_<k>", implementation: runtime/integer_add.py, harness: "rt.add_{T.kind}({0}, {1})"}
  - {id: core.integer.sub, contract_version: 1.0.0, symbol: "rt.sub_<k>", implementation: runtime/integer_sub.py, harness: "rt.sub_{T.kind}({0}, {1})"}
  - {id: core.integer.mul, contract_version: 1.0.0, symbol: "rt.mul_<k>", implementation: runtime/integer_mul.py, harness: "rt.mul_{T.kind}({0}, {1})"}
  - {id: core.integer.div, contract_version: 1.0.0, symbol: "rt.div_<k>", implementation: runtime/integer_div.py, harness: "rt.div_{T.kind}({0}, {1})"}
  - {id: core.integer.rem, contract_version: 1.0.0, symbol: "rt.rem_<k>", implementation: runtime/integer_rem.py, harness: "rt.rem_{T.kind}({0}, {1})"}
  - {id: core.integer.and, contract_version: 1.0.0, symbol: "rt.and_<k>", implementation: runtime/integer_and.py, harness: "rt.and_{T.kind}({0}, {1})"}
  - {id: core.integer.or, contract_version: 1.0.0, symbol: "rt.or_<k>", implementation: runtime/integer_or.py, harness: "rt.or_{T.kind}({0}, {1})"}

  - {id: core.integer.andnot, contract_version: 1.0.0, symbol: "rt.andnot_<k>", implementation: runtime/integer_andnot.py, harness: "rt.andnot_{T.kind}({0}, {1})"}
  - {id: core.integer.neg, contract_version: 1.0.0, symbol: "rt.neg_<k>", implementation: runtime/integer_neg.py, harness: "rt.neg_{T.kind}({0})"}
  - {id: core.integer.not, contract_version: 1.0.0, symbol: "rt.not_<k>", implementation: runtime/integer_not.py, harness: "rt.not_{T.kind}({0})"}
  - {id: core.integer.shl, contract_version: 1.0.0, symbol: "rt.shl_<k>", implementation: runtime/integer_shl.py, harness: "rt.shl_{T.kind}({0}, {1})"}

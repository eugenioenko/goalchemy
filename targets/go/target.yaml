  - {id: core.slice.slice, contract_version: 1.0.0, symbol: "rt.SliceSlice", implementation: runtime/slice_slice.go, harness: "rt.SliceSlice({0}, {1}, {2}, {3})"}
  - {id: core.slice.append, contract_version: 1.0.0, symbol: "rt.Append", implementation: runtime/slice_append.go, harness: "rt.Append({0}, {1}...)"}
  - {id: core.slice.copy, contract_version: 1.0.0, symbol: "rt.SliceCopy", implementation: runtime/slice_copy.go, harness: "rt.SliceCopy({0}, {1})"}
  - {id: core.map.make, contract_version: 1.0.0, symbol: "rt.NewMap", implementation: runtime/map_make.go, harness: "rt.NewMap[{K}, {V}]()"}
  - {id: core.map.lookup, contract_version: 1.0.0, symbol: "(*rt.Map).Get", implementation: runtime/map_lookup.go, harness: "{0}.Get({1})"}
  - {id: core.map.store, contract_version: 1.0.0, symbol: "(*rt.Map).Set", implementation: runtime/map_store.go, harness: "{0}.Set({1}, {2})"}
  - {id: core.map.delete, contract_version: 1.0.0, symbol: "(*rt.Map).Delete", implementation: runtime/map_delete.go, harness: "{0}.Delete({1})"}
  - {id: core.map.len, contract_version: 1.0.0, symbol: "(*rt.Map).Len", implementation: runtime/map_len.go, harness: "{0}.Len()"}
  - {id: core.map.clear, contract_version: 1.0.0, symbol: "(*rt.Map).Clear", implementation: runtime/map_clear.go, harness: "{0}.Clear()"}
  - {id: core.map.iterate, contract_version: 1.0.0, symbol: "(*rt.Map).Iter", implementation: runtime/map_iterate.go, requires: [core.map.len], harness: "rt.MapKeys({0})"}
  - {id: core.print, contract_version: 1.0.0, symbol: "rt.PrintString", implementation: runtime/print.go, harness: "rt.PrintString({0})"}

  - {id: core.task.spawn, contract_version: 1.0.0, symbol: "spawn", implementation: runtime/task_spawn.rs, harness: "await: call(t, new_spawn_check())", requires: [std.context.err]}
  - {id: core.chan.make, contract_version: 1.0.0, symbol: "make_chan", implementation: runtime/chan_make.rs, harness: "make_chan({0}, {T.zerofn})", requires: [core.task.spawn]}

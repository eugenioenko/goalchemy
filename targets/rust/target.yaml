  - {id: core.chan.close, contract_version: 1.0.0, symbol: "chan_close", implementation: runtime/chan_close.rs, harness: "chan_close({0})", requires: [core.chan.make]}
  - {id: core.chan.len, contract_version: 1.0.0, symbol: "chan_len", implementation: runtime/chan_len.rs, harness: "chan_len({0})", requires: [core.chan.make]}

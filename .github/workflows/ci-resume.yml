name: Resume CI after retry

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  resume:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.run_attempt > 1
    runs-on: ubuntu-latest
    concurrency:
      group: repository-runner-1
      cancel-in-progress: false
      queue: max
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Resume cancelled jobs after a repaired failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-resume.py resume

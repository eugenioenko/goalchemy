name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, proto/go-native-pause]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    concurrency:
      group: repository-runner-${{ matrix.runner_slot || 4 }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: ${{ matrix.timeout || 45 }}
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        include:
          - {name: Core compiler, suite: core, runner_slot: 1}
          - {name: Language and corpus (Go), suite: language, target: go, runner_slot: 2}
          - {name: "Native pause model (Swift, optional)", suite: pause-swift, target: swift, runner_slot: 4, timeout: 150, optional: true}
          - {name: "Native pause model (Rust, optional)", suite: pause-rust, target: rust, runner_slot: 3, timeout: 180, optional: true}
          - {name: Language and corpus (TypeScript), suite: language, target: typescript, runner_slot: 3}
          - {name: Language and corpus (Python), suite: language, target: python, runner_slot: 4}
          - {name: Language and corpus (Java), suite: language, target: java, runner_slot: 1}
          - {name: Language and corpus (C#), suite: language, target: csharp, runner_slot: 2}
          - {name: Language and corpus (Rust), suite: language, target: rust, timeout: 60, runner_slot: 3}
          - {name: Language and corpus (C), suite: language, target: c, runner_slot: 4}
          - {name: Language and corpus (Swift), suite: language, target: swift, runner_slot: 4}
          - {name: Native contracts and browser, suite: contracts, runner_slot: 2}
          - {name: HTTP contracts all targets, suite: contracts, shard: 1, runner_slot: 3}
          - {name: Integration 1 of 4, suite: integration, shard: 0, runner_slot: 4}
          - {name: Integration 2 of 4, suite: integration, shard: 1, runner_slot: 1}
          - {name: Integration 3 of 4, suite: integration, shard: 2, runner_slot: 2}
          - {name: Integration 4 of 4, suite: integration, shard: 3, runner_slot: 3}
          - {name: Examples and reproducible output all targets, suite: examples, runner_slot: 4}
          - {name: Memory and sanitizers, suite: memory, runner_slot: 1}
          - {name: Float differential all targets, suite: floats, runner_slot: 2}
          - {name: Naming modes all targets, suite: naming, runner_slot: 3}
          - {name: Runtime conformance all targets, suite: runtime, runner_slot: 4}
          - {name: Native pause model, suite: pause, runner_slot: 1}
          - {name: Native pause model (Python), suite: pause, target: python, runner_slot: 2}
          - {name: Native pause model (Java), suite: pause-java, runner_slot: 3}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            ci/browser-tooling/package-lock.json
            targets/typescript/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
        id: rust
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgc-dev libcurl4-openssl-dev libssl-dev zlib1g-dev libedit2 libxml2 perl ripgrep
      - name: Cache the shared Cargo target of generated Rust fixtures
        if: matrix.target == 'rust'
        uses: actions/cache@v5
        with:
          path: out/fixture-cargo
          key: ${{ runner.os }}-fixture-cargo-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('targets/rust/tests/harness/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-fixture-cargo-${{ steps.rust.outputs.cachekey }}-
      - name: Cache pinned toolchain downloads
        uses: actions/cache@v5
        with:
          path: .toolchains/downloads
          key: ${{ runner.os }}-native-tools-${{ hashFiles('toolchains.lock') }}
      - name: Cache locked Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('targets/rust/tests/harness/Cargo.lock') }}
      - name: Cache pinned Playwright browsers
        uses: actions/cache@v5
        with:
          path: .toolchains/playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('ci/browser-tooling/package-lock.json') }}
      - name: Cache pinned Java dependencies
        uses: actions/cache@v5
        with:
          path: out/java-dependencies
          key: ${{ runner.os }}-java-dependencies-${{ hashFiles('targets/java/dependencies.lock.json') }}
      - name: Prepare pinned native and browser test dependencies
        run: bash scripts/ci-bootstrap.sh --with-browser-deps
      - name: Run selected checks
        run: python3 scripts/ci-suite.py '${{ matrix.suite }}' --shard '${{ matrix.shard || 0 }}' --target '${{ matrix.target || '' }}'

  # Preserve the existing required check name and fail if any shard fails or skips.
  test:
    permissions:
      contents: read
      actions: read
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: repository-runner-2
      cancel-in-progress: false
      queue: max
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Require every matrix check across all attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-resume.py check --run-id "${{ github.run_id }}"
      - name: Require all CI checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            ci/browser-tooling/package-lock.json
            targets/typescript/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgc-dev libcurl4-openssl-dev libssl-dev perl ripgrep
      - name: Cache pinned toolchain downloads
        uses: actions/cache@v5
        with:
          path: .toolchains/downloads
          key: ${{ runner.os }}-native-tools-${{ hashFiles('toolchains.lock') }}
      - name: Cache locked Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('targets/rust/tests/harness/Cargo.lock') }}
      - name: Prepare pinned native and browser test dependencies
        run: bash scripts/ci-bootstrap.sh --with-browser-deps
      - run: go vet ./...
      - run: go run ./cmd/goalchemy spec generate -check
      # Preserve the short suite, including native browser and focused C sanitizer tests.
      - run: go test -short -timeout 30m ./...
      # The short language suite covers Go/TypeScript; exercise float values,
      # conversions and collection semantics through every released target.
      - name: All-seven float language differential tests
        env:
          FIXTURE: floats
        run: |
          test -f tests/language/testdata/floats/main.go
          test -f tests/language/testdata/co_floats/main.go
          go test -v -timeout 15m ./tests/language -run '^TestFixtures$' -count=1
      # No -short here: every canonical case must run through all seven host harnesses.
      - name: All-seven runtime contract conformance
        run: go test -v -timeout 15m ./tests/contracts -run '^TestTargetConformance$' -count=1
